name: Publish fragrance library
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Refresh fragrance prices]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build compact catalog and on-demand profiles
        run: node scripts/build_runtime.js
      - name: Prepare public website files
        run: |
          mkdir _site
          cp fragbot-dialogue.js fragbot.js fragbot-core.js fragbot.css home-cover.js home-cover.css spotlight.css fragrance-spotlight.js launch-polish.css value-demo.js templates.html templates.css templates.js assistant-widget.js admin.html admin.css admin.js catalog-updates.js luxury.css home.js home.css index.html styles.css theme.js app.js runtime-data.js fragrance-details.js market-prices.js pricing.js portfolio.js catalog.js config.js auth.js cloud-store.js google-signin.js username-auth.js photo-standards.js _site/
          cp -R assets data _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
